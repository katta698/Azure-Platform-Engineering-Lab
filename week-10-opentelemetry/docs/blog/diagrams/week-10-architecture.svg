<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 490" width="1280" height="490" role="img" aria-label="Architecture diagram. Both container images are pulled from a Basic container registry using a user-assigned managed identity holding AcrPull, with the registry admin user disabled, so no password exists in the pull path. Inside the Container Apps environment a public frontend calls an internal-only backend, passing a traceparent header so the two spans belong to one trace. Both apps export spans over OTLP gRPC to the managed OpenTelemetry agent that Azure runs inside the environment at no compute cost. The agent forwards traces and logs to Application Insights, which is workspace-based and stores them in week 08's Log Analytics workspace. Measured: frontend p50 256.4 ms, backend p50 250.8 ms.">
