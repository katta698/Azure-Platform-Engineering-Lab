<svg style="width:100%;height:auto" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" role="img"
     aria-label="Week 2 architecture: the ordering that removes the remediation race, and the three stages. First a user-assigned identity is created so its principal ID exists, then three role assignments are granted to it at the dev landing zone management group, then it is attached to the policy assignment, with depends_on forcing that order. Below, three stages: audit with no grants changes nothing, deployIfNotExists with no grants fails every deployment, and deployIfNotExists with the three grants remediates everything to fully compliant.">
  <style>
    /* Every colour here is fixed. blog.js re-parents this SVG into a lightbox
       with its own colour context, so a diagram that inherits colour from its
       surroundings washes out to near-invisible there while looking correct
       inline. Depending on nothing outside this file is what makes it render
       the same inline, in the lightbox, and in either theme. */
    .b    { fill: none; stroke: #aab2bd; stroke-width: 1.5; }
    .bx   { fill: none; stroke: #6b7280; stroke-width: 1.5; }
    .t    { fill: #1f2937; font: 600 14px system-ui, sans-serif; }
    .s    { fill: #5b6470; font: 400 12px system-ui, sans-serif; }
    .m    { fill: #374151; font: 400 12px ui-monospace, monospace; }
    .n    { fill: #6b7280; font: 600 12px system-ui, sans-serif; }
    .ar   { stroke: #8b939e; stroke-width: 1.5; fill: none; }
    .fail { fill: none; stroke: #c62828; stroke-width: 2; }
    .failt{ fill: #c62828; font: 600 12px system-ui, sans-serif; }
    .okb  { fill: none; stroke: #2e7d32; stroke-width: 2; }
    .okt  { fill: #2e7d32; font: 600 12px system-ui, sans-serif; }
    .warn { fill: none; stroke: #b45309; stroke-width: 2; }
    .warnt{ fill: #b45309; font: 600 12px system-ui, sans-serif; }
  </style>
  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8b939e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>

  <!-- ── The ordering ─────────────────────────────────────────────────── -->
  <rect class="bx" x="24" y="16" width="952" height="212" rx="8"/>
  <text class="t" x="44" y="42">The ordering that removes the race</text>
  <text class="s" x="292" y="42">a user-assigned identity can be granted before anything evaluates</text>

  <rect class="b" x="52" y="60" width="252" height="96" rx="6"/>
  <text class="n" x="70" y="84">1 — create the identity</text>
  <text class="m" x="70" y="106">id-wk02-policy-</text>
  <text class="m" x="70" y="122">remediation</text>
  <text class="s" x="70" y="142">principal_id exists now</text>

  <path class="ar" d="M308,108 L344,108" marker-end="url(#a2)"/>

  <rect class="b" x="348" y="60" width="288" height="104" rx="6"/>
  <text class="n" x="366" y="84">2 — grant it, at mg-lz-dev</text>
  <text class="s" x="366" y="106">Monitoring Contributor</text>
  <text class="s" x="366" y="124">Log Analytics Contributor</text>
  <text class="s" x="366" y="142">Tag Contributor</text>

  <path class="ar" d="M640,108 L676,108" marker-end="url(#a2)"/>

  <rect class="b" x="680" y="60" width="270" height="96" rx="6"/>
  <text class="n" x="698" y="84">3 — attach to the assignment</text>
  <text class="m" x="698" y="106">assign-remediation-dev</text>
  <text class="s" x="698" y="126">identity { UserAssigned }</text>
  <text class="s" x="698" y="144">at mg-lz-dev</text>

  <rect class="warn" x="52" y="176" width="898" height="38" rx="6"/>
  <text class="warnt" x="70" y="200">depends_on is load-bearing: Terraform sees step 3 reference the identity, not the grants — without it, 3 may run before 2.</text>

  <!-- ── The three stages ─────────────────────────────────────────────── -->
  <text class="t" x="24" y="264">Three stages. Only the role assignments change.</text>

  <rect class="b" x="24" y="280" width="304" height="230" rx="6"/>
  <text class="n" x="44" y="304">Stage 1 — audit</text>
  <text class="s" x="44" y="330">effects</text>
  <text class="m" x="112" y="330">AuditIfNotExists</text>
  <text class="s" x="44" y="352">grants</text>
  <text class="m" x="112" y="352">none</text>
  <text class="s" x="44" y="386">2 storage accounts flagged.</text>
  <text class="s" x="44" y="404">Nothing is changed.</text>
  <rect class="b" x="44" y="424" width="264" height="66" rx="5"/>
  <text class="s" x="60" y="448">The identity still exists —</text>
  <text class="s" x="60" y="466">a definition containing a</text>
  <text class="s" x="60" y="482">deployment demands one.</text>

  <rect class="fail" x="348" y="280" width="304" height="230" rx="6"/>
  <text class="failt" x="368" y="304">Stage 2 — the deliberate failure</text>
  <text class="s" x="368" y="330">effects</text>
  <text class="m" x="436" y="330">DeployIfNotExists</text>
  <text class="s" x="368" y="352">grants</text>
  <text class="failt" x="436" y="352">withheld</text>
  <text class="s" x="368" y="386">storage-diagnostics  2 of 2 failed</text>
  <text class="s" x="368" y="404">inherit-tag  4 of 4 failed</text>
  <rect class="fail" x="368" y="424" width="264" height="66" rx="5"/>
  <text class="failt" x="384" y="448">PolicyAuthorizationFailed</text>
  <text class="s" x="384" y="468">names a deployment, not the</text>
  <text class="s" x="384" y="484">role that is missing</text>

  <rect class="okb" x="672" y="280" width="304" height="230" rx="6"/>
  <text class="okt" x="692" y="304">Stage 3 — remediation</text>
  <text class="s" x="692" y="330">effects</text>
  <text class="m" x="760" y="330">DeployIfNotExists</text>
  <text class="s" x="692" y="352">grants</text>
  <text class="okt" x="760" y="352">all three</text>
  <text class="s" x="692" y="386">storage-diagnostics  2 of 2 done</text>
  <text class="s" x="692" y="404">inherit-tag  4 of 4 done</text>
  <rect class="okb" x="692" y="424" width="264" height="66" rx="5"/>
  <text class="okt" x="708" y="448">Compliant — 100% (5 of 5)</text>
  <text class="s" x="708" y="468">Same definitions, same</text>
  <text class="s" x="708" y="484">assignment, same identity.</text>

  <!-- ── The definition decides the role ──────────────────────────────── -->
  <rect class="bx" x="24" y="534" width="952" height="120" rx="8"/>
  <text class="t" x="44" y="560">Why the tag rule is a custom copy of a built-in</text>

  <rect class="b" x="52" y="576" width="440" height="60" rx="6"/>
  <text class="s" x="70" y="598">Built-in “Inherit a tag from the resource group”</text>
  <text class="warnt" x="70" y="620">roleDefinitionIds names Contributor</text>

  <path class="ar" d="M500,606 L536,606" marker-end="url(#a2)"/>

  <rect class="b" x="540" y="576" width="410" height="60" rx="6"/>
  <text class="s" x="558" y="598">This week’s copy — identical rule, one line changed</text>
  <text class="okt" x="558" y="620">roleDefinitionIds names Tag Contributor</text>

  <text class="s" x="24" y="678">An assignment cannot grant less than its definition demands, so the only place to reduce that blast radius is the definition itself.</text>
</svg>
