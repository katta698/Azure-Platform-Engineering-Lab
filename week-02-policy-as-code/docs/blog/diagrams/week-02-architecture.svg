<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 395" width="1280" height="395" role="img" aria-label="Architecture diagram. At the mg-katta management group, two policy definitions — a deployIfNotExists rule and a modify rule — are bundled into one initiative. The initiative is assigned at the mg-lz-dev management group, and that assignment carries a user-assigned managed identity which holds three role assignments at mg-lz-dev. Acting through that identity, remediation reaches the test bed resource group, where two deliberately non-compliant storage accounts have diagnostic settings deployed pointing at a Log Analytics workspace, and inherit a cost-center tag from their resource group.">
