<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 395" width="1280" height="395" role="img" aria-label="Architecture diagram. A custom policy definition, deny-public-ip-on-nic, is defined once at the mg-katta management group and bundled into an initiative with allowed locations and a required tag. That one initiative is assigned twice: at mg-platform, where it always enforces, and at mg-lz-dev, where it is staged. Neither assignment names a subscription, and neither sits at the Tenant Root Group. Four subscriptions inherit the rules by position in the tree rather than by being listed. A test bed resource group holding a virtual network and subnet sits under the dev landing zone and is governed by inheritance alone.">
