<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-label="Architecture diagram. At the subscription, a diagnostic setting forwards three Azure Activity log categories — Administrative, Policy and Security — into a Log Analytics workspace that has Microsoft Sentinel enabled on it. Sentinel has no icon in Microsoft's published set, so it is named on the workspace node rather than drawn with a borrowed logo, and the Sentinel-specific objects are plain cards for the same reason. Two scheduled analytics rules read the AzureActivity table every five minutes over a one-hour window: a positive control on role assignment creation, which is deliberately triggered, and a negative control on policy assignment deletion, which must stay silent. The positive control raised thirteen alerts, which incident grouping collapsed into three incidents, and an automation rule applied three labels to each without a Logic App.">
