<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" role="img" aria-label="Architecture diagram. Inside a virtual network with no inbound rules, a virtual machine runs self-managed Prometheus 3.5.0, and a public IP address provides egress only. A user-assigned managed identity below the virtual network supplies Prometheus with a token from the instance metadata service, so no credential is stored. Prometheus remote-writes over HTTPS into Azure Monitor managed service for Prometheus: the data collection endpoint supplies the URL host and the data collection rule is named in its path and accepts the write. The samples are stored in an Azure Monitor workspace, which holds Prometheus time series queried with PromQL. Azure Managed Grafana reads that workspace with PromQL, and a Prometheus rule group evaluates one alert rule and one recording rule against the same workspace, with no Kubernetes cluster named anywhere.">
