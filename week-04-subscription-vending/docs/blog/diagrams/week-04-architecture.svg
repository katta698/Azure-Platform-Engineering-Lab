<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="Architecture diagram. A request carrying a landing zone name, owner and budget goes to the Subscription Alias API, which creates a subscription at tenant level and is irreversible. The alias API leaves every subscription under the Tenant Root Group, so a separate call to the Management Groups API places it at mg-lz-dev. Only then are a consumption budget and a role assignment applied. Create without place and the result is a subscription that is billed, healthy, and inherits nothing.">
