<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 600" width="1280" height="600" role="img" aria-label="Architecture diagram in two bands. The permanent band costs about nothing per hour and stays up: a hub virtual network at 10.0.0.0/16 in the connectivity subscription, peered in both directions with a spoke virtual network at 10.1.0.0/16 in the lab subscription, and six private DNS zones linked to BOTH networks rather than to the hub alone. The billable band is deployed deliberately and destroyed the same day: an Azure Firewall Basic at about 40 cents an hour, a two-tier firewall policy where the child inherits the parent's rules and cannot remove them, and a spoke route table whose default route to the firewall is added only when the firewall exists.">
