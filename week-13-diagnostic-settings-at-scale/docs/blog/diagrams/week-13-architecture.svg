<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-label="Architecture diagram. At subscription scope, a built-in Azure Policy initiative is assigned with a system-assigned managed identity holding Log Analytics Contributor; the identity is what deployIfNotExists deploys as. Inside the resource group, four target resources produce three outcomes. A key vault and a public IP are remediated and send resource logs to the Log Analytics workspace. A network security group is untouched, because it supports the allLogs category group and not audit. A storage account is untouched because no built-in policy covers the type at any category group. The workspace itself is also covered and logs itself. Remediation tasks are created per policy, not per initiative.">
