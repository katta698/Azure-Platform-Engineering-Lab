<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 580" width="1280" height="580" role="img" aria-label="Architecture diagram. One hundred rows are sent to a data collection endpoint and rule, where a single line of KQL is applied at ingest time. Eighty rows are dropped there: never stored, never billed, and never counted against the daily cap. The twenty rows that are kept land in a Log Analytics workspace holding two custom tables on deliberately different plans, an Analytics table for the alerting path whose queries are free to run, and a Basic table for the incident path which is cheaper to ingest but bills per gigabyte scanned. A scheduled query alert watches for the daily cap being reached, because a cap that trips in silence is data loss nobody noticed.">
