<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-label="Architecture diagram. A virtual network holds two subnets. In the application subnet, an Ubuntu virtual machine with no public IP address carries a user-assigned managed identity, and reaches the internet only outbound through a NAT gateway with a single public IP. In the database subnet, a private endpoint holds the address 10.60.1.4. A private DNS zone named privatelink.postgres.database.azure.com resolves the server's public hostname to that private address, so the client connects using the documented FQDN. The PostgreSQL flexible server sits outside the virtual network as a platform service, with public network access disabled, password authentication disabled, and no local administrator account at all; its only administrator is the managed identity. A standby replica in the same availability zone receives synchronous commits and is what a forced failover promotes. Microsoft Entra ID issues the access token that the virtual machine fetches from the instance metadata service and sends as its password.">
