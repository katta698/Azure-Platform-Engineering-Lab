<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="Week 7 workload identity. A GitHub Actions run mints a short-lived OIDC token describing the repository and branch. Entra checks it against a federated credential on a user-assigned managed identity, matching issuer, audience and an exact subject, then returns an Azure access token scoped to the Reader role. No secret is stored anywhere.">
  <defs>
    <style>
      .t    { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .hdr  { font-size: 13px; font-weight: 700; fill: #1f2933; }
      .lbl  { font-size: 12px; fill: #1f2933; }
      .sm   { font-size: 11px; fill: #52606d; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; fill: #1f2933; }
      .box  { fill: #ffffff; stroke: #c3cbd5; stroke-width: 1.2; }
      .free { fill: #f2f9f4; stroke: #8fbf9f; stroke-width: 1.2; }
      .band { fill: #f5f7fa; stroke: #dbe1e8; stroke-width: 1; }
      .flow { stroke: #4a7fb5; stroke-width: 1.8; fill: none; }
      .ok   { fill: #1b6e3c; }
      .no   { fill: #a4262c; }
    </style>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7fb5"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="470" fill="#ffffff"/>
  <text class="t hdr" x="24" y="28">No password exists anywhere in this picture.</text>

  <!-- GITHUB -->
  <rect class="band" x="24" y="44" width="390" height="180" rx="8"/>
  <text class="t hdr" x="42" y="68">GITHUB ACTIONS</text>
  <text class="t sm" x="42" y="88">the workflow runs on GitHub's infrastructure, not Azure's</text>
  <rect class="box" x="42" y="100" width="354" height="106" rx="6"/>
  <text class="t lbl" x="58" y="122">repository variables &#8212; not secrets</text>
  <text class="t mono" x="58" y="142">AZURE_CLIENT_ID</text>
  <text class="t mono" x="58" y="160">AZURE_TENANT_ID</text>
  <text class="t mono" x="58" y="178">AZURE_SUBSCRIPTION_ID</text>
  <text class="t sm ok" x="58" y="198">secrets configured: 0</text>

  <!-- ENTRA -->
  <rect class="band" x="486" y="44" width="390" height="180" rx="8"/>
  <text class="t hdr" x="504" y="68">MICROSOFT ENTRA</text>
  <text class="t sm" x="504" y="88">the federated credential, configured once</text>
  <rect class="free" x="504" y="100" width="354" height="106" rx="6"/>
  <text class="t sm" x="520" y="120">issuer &#8212; token.actions.githubusercontent.com</text>
  <text class="t sm" x="520" y="138">audience &#8212; api://AzureADTokenExchange</text>
  <text class="t sm" x="520" y="156">subject &#8212; exact match, immutable IDs:</text>
  <text class="t mono" x="520" y="174">repo:owner@63027619/repo@1342954118</text>
  <text class="t mono" x="520" y="192">  :ref:refs/heads/main</text>

  <!-- flow arrows between them -->
  <path class="flow" d="M 414 132 L 484 132" marker-end="url(#b)"/>
  <text class="t sm" x="449" y="124" text-anchor="middle">token</text>

  <!-- RESULT -->
  <rect class="band" x="24" y="244" width="852" height="96" rx="8"/>
  <text class="t hdr" x="42" y="268">WHAT COMES BACK</text>
  <text class="t sm" x="42" y="290">An Azure access token, valid for this run only, carrying exactly one role assignment:</text>
  <rect class="box" x="42" y="300" width="380" height="28" rx="6"/>
  <text class="t mono" x="58" y="319">Reader on sub-lab-dev</text>
  <text class="t sm ok" x="440" y="313">reads the subscription &#8212; succeeds</text>
  <text class="t sm no" x="680" y="313">creates anything &#8212; refused</text>

  <!-- WHY -->
  <rect class="band" x="24" y="360" width="852" height="88" rx="8"/>
  <text class="t hdr" x="42" y="384">WHY THIS IS DIFFERENT FROM A SERVICE PRINCIPAL WITH A SECRET</text>
  <text class="t sm" x="42" y="406">A managed identity cannot hold a password &#8212; the API has nowhere to put one. So "no secret" is a property of the</text>
  <text class="t sm" x="42" y="424">object, not a discipline somebody has to keep. There is nothing to rotate, nothing to expire, and nothing to leak.</text>
  <text class="t sm no" x="42" y="442">A renamed or transferred repository does not carry the trust: the numeric IDs in the subject stop matching.</text>
</svg>
