<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 430" width="1280" height="430" role="img" aria-label="Architecture diagram. A module source directory wraps an Azure Verified Module pinned at version 0.10.0. publish.sh runs git archive against a git tag and uploads to an HCP private registry, which holds storage-baseline 1.0.0 and 2.0.0 as immutable versions. One Terraform configuration with one state file then consumes both: module app_a pinned to 1.0.0 creates a storage account with shared keys enabled and no diagnostics, while module app_b pinned to 2.0.0 creates a storage account with shared keys disabled and diagnostics sent to a Log Analytics workspace. Adding app_b changed nothing about app_a.">
