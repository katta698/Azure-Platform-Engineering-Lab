<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="Week 09 Container Apps. A request from the internet arrives at HTTPS-only ingress on a container app in sub-lab-dev. The app runs between zero and three replicas, scaling on concurrent requests, and sits inside a Container Apps environment on the Consumption plan. When idle the app drops to zero replicas and bills nothing, measured at about ten minutes after the last request; the next request waits for a cold start. The environment sends two log categories through a diagnostic setting across a subscription boundary into week 08's Log Analytics workspace in sub-management, which this week reads but does not own.">
  <defs>
    <style>
      .t    { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .hdr  { font-size: 13px; font-weight: 700; fill: #1f2933; }
      .lbl  { font-size: 12px; fill: #1f2933; }
      .sm   { font-size: 11px; fill: #52606d; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; fill: #1f2933; }
      .box  { fill: #ffffff; stroke: #c3cbd5; stroke-width: 1.2; }
      .live { fill: #f2f9f4; stroke: #8fbf9f; stroke-width: 1.3; }
      .zero { fill: #f6f7f9; stroke: #b9c0c9; stroke-width: 1.3; stroke-dasharray: 5 3; }
      .band { fill: #f5f7fa; stroke: #dbe1e8; stroke-width: 1; }
      .own  { fill: #f7f5fb; stroke: #b3a8d1; stroke-width: 1.2; }
      .flow { stroke: #4a7fb5; stroke-width: 1.8; fill: none; }
      .logs { stroke: #6b5b9a; stroke-width: 1.6; fill: none; }
      .ok   { fill: #1b6e3c; font-weight: 700; }
      .cost { fill: #8a5a00; font-weight: 700; }
    </style>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7fb5"/>
    </marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b5b9a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="520" fill="#ffffff"/>
  <text class="t hdr" x="24" y="28">Nothing runs until someone asks. The first person to ask pays for the wait.</text>

  <!-- ── the request ── -->
  <rect class="box" x="24" y="56" width="150" height="74" rx="6"/>
  <text class="t hdr" x="38" y="80">A REQUEST</text>
  <text class="t sm" x="38" y="100">from the internet,</text>
  <text class="t sm" x="38" y="116">HTTPS only</text>

  <path class="flow" d="M174,93 L252,93" marker-end="url(#b)"/>

  <!-- ── sub-lab-dev band ── -->
  <rect class="band" x="252" y="44" width="372" height="256" rx="8"/>
  <text class="t hdr" x="268" y="66">sub-lab-dev</text>
  <text class="t sm" x="268" y="84">mg-lz-dev — the workload is an application</text>

  <!-- environment -->
  <rect class="box" x="268" y="98" width="340" height="186" rx="6"/>
  <text class="t hdr" x="284" y="120">CONTAINER APPS ENVIRONMENT</text>
  <text class="t sm" x="284" y="138">Consumption plan — no hourly fee of its own</text>

  <!-- the app -->
  <rect class="live" x="284" y="152" width="150" height="76" rx="5"/>
  <text class="t hdr" x="296" y="174">1 replica</text>
  <text class="t sm" x="296" y="192">serving traffic</text>
  <text class="t sm" x="296" y="208">0.25 vCPU / 0.5Gi</text>
  <text class="t sm ok" x="296" y="222">billed</text>

  <rect class="zero" x="448" y="152" width="146" height="76" rx="5"/>
  <text class="t hdr" x="460" y="174">0 replicas</text>
  <text class="t sm" x="460" y="192">after ~10 min idle</text>
  <text class="t sm" x="460" y="208">nothing running</text>
  <text class="t sm ok" x="460" y="222">$0.00</text>

  <path class="flow" d="M434,178 L446,178" marker-end="url(#b)"/>
  <text class="t sm" x="300" y="252">scales on CONCURRENT REQUESTS, 10 per replica, ceiling of 3</text>
  <text class="t mono cost" x="300" y="270">first request after idle: 16.9s   (warm: 0.13s)</text>

  <!-- ── logs across the boundary ── -->
  <path class="logs" d="M608,190 L672,190" marker-end="url(#p)"/>
  <text class="t sm" x="612" y="182">logs</text>

  <rect class="own" x="672" y="44" width="204" height="256" rx="8"/>
  <text class="t hdr" x="688" y="66">sub-management</text>
  <text class="t sm" x="688" y="84">mg-management — platform</text>
  <text class="t sm" x="688" y="100">telemetry</text>

  <rect class="box" x="688" y="118" width="172" height="166" rx="6"/>
  <text class="t hdr" x="702" y="140">WEEK 08's WORKSPACE</text>
  <text class="t sm" x="702" y="160">read, never owned —</text>
  <text class="t sm" x="702" y="176">a data source cannot</text>
  <text class="t sm" x="702" y="192">be destroyed by this</text>
  <text class="t sm" x="702" y="208">week's teardown</text>
  <text class="t mono" x="702" y="232">ContainerAppConsoleLogs</text>
  <text class="t mono" x="702" y="248">ContainerAppSystemLogs</text>
  <text class="t sm" x="702" y="270">Dedicated tables</text>

  <!-- ── the forced decision ── -->
  <rect class="band" x="24" y="324" width="852" height="80" rx="8"/>
  <text class="t hdr" x="40" y="348">WHY THE LOGS GO THE LONG WAY ROUND</text>
  <text class="t lbl" x="40" y="370">The default log path wires the environment to a workspace using that workspace's SHARED KEY. Week 08 disabled local</text>
  <text class="t lbl" x="40" y="388">authentication, so there is no key to hand over — the default cannot work here. A diagnostic setting authenticates as ARM instead.</text>

  <text class="t sm" x="24" y="432">5 resources: resource group, user-assigned identity, environment, container app, diagnostic setting.</text>
  <text class="t sm" x="24" y="450">The identity holds no password, because a managed identity cannot have one. It is the seam a private registry would use.</text>
  <text class="t sm" x="24" y="468">Free each month per subscription: 180,000 vCPU-seconds, 360,000 GiB-seconds, 2 million requests. Health probes are not billed.</text>
  <text class="t sm" x="24" y="486">Idle replicas bill at a reduced rate — but only if the floor is above zero. A floor of zero has no idle state to bill.</text>
</svg>
